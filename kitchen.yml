---
driver:
  name: dokken

transport:
  name: dokken

provisioner:
  name: dokken
  # Selects the Cinc rebuild of Chef Infra Client. kitchen-dokken derives both
  # the image (cincproject/cinc) and the client binary
  # (/opt/cinc/bin/cinc-client) from this, so neither needs to be set here.
  product_name: cinc
  deprecations_as_errors: true
  enforce_idempotency: true
  multiple_converge: 2

verifier:
  name: inspec
  inspec_tests:
    - test/integration/default

platforms:
  - name: debian-13
    driver:
      image: dokken/debian-13
  - name: rockylinux-9
    driver:
      image: dokken/rockylinux-9
  - name: rockylinux-10
    driver:
      image: dokken/rockylinux-10
  - name: fedora-43
    driver:
      image: dokken/fedora-43
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04

# Major-version tags float to the newest Cinc release in that line. Cinc 17 is
# not tested: cincproject/cinc:17 is published for amd64 only.
suites:
  - name: cinc-19
    driver:
      chef_version: 19
  - name: cinc-18
    driver:
      chef_version: 18
