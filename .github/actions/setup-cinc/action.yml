---
name: Set up Cinc Workstation
description: Installs a pinned Cinc Workstation from the Cinc omnitruck endpoint.

inputs:
  version:
    description: >-
      Cinc Workstation version to install. The default is pinned so that CI
      matches the version documented in TESTING.md, and so that a new upstream
      release cannot turn every pull request red on its own.
    required: false
    # renovate: cinc-workstation
    default: 26.2.4

runs:
  using: composite
  steps:
    # The platform, not just the operating system. Every Ubuntu release gets
    # its own build of the package under the same filename, so a key of
    # Linux-X64 alone would hand a 24.04 package to a 26.04 runner the day
    # ubuntu-latest moves. The installer would find the name, skip the
    # download, fail the checksum against the metadata for the new release,
    # and exit rather than fetching the right one, leaving every job red until
    # somebody edited this key.
    - name: Identify the runner platform
      id: platform
      shell: bash
      run: ${{ github.action_path }}/detect-platform

    # The package, not the installed tree. /opt/cinc-workstation is far larger
    # than the package it came from, and restoring it would also mean putting
    # back what dpkg records and links outside of it.
    #
    # No restore-keys. A partial match would restore a package built for
    # another version or another release, which is worse than a miss: the
    # installer stops at the checksum instead of downloading the right one.
    - name: Cache the Cinc Workstation package
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cinc-workstation
        key: cinc-workstation-${{ steps.platform.outputs.id }}-${{ runner.arch }}-${{ inputs.version }}

    # Addressed through action_path, as the step above is. A composite
    # action's run steps execute in the caller's working directory rather
    # than in its own, so a repo relative path here would depend on this
    # action being checked out at the root of the repository running it.
    - name: Install Cinc Workstation ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CACHE_DIR: ${{ runner.temp }}/cinc-workstation
      run: ${{ github.action_path }}/install-cinc
