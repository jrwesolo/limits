---
name: Set up Cinc Workstation
description: Installs a pinned Cinc Workstation from the Cinc omnitruck endpoint.

inputs:
  version:
    description: >-
      Cinc Workstation version to install. The default is pinned so that CI
      matches the version documented in TESTING.md, and so that a new upstream
      release cannot turn every pull request red on its own.
    required: false
    default: 26.2.4

runs:
  using: composite
  steps:
    # The package, not the installed tree. /opt/cinc-workstation is far larger
    # than the package it came from, and restoring it would also mean putting
    # back what dpkg records and links outside of it.
    #
    # The version is in the key rather than in restore-keys, because a package
    # for a different version is of no use: the installer would ignore it and
    # download the one it was asked for anyway.
    - name: Cache the Cinc Workstation package
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cinc-workstation
        key: cinc-workstation-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install Cinc Workstation ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CACHE_DIR: ${{ runner.temp }}/cinc-workstation
      run: .github/scripts/install-cinc
